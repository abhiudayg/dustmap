name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Frontend Dependencies
        working-directory: app
        run: bun install

      - name: Run Full Verification Suite (.verify)
        run: .verify/run.sh

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')

      - name: Write notarization API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build DustMap.app (Tauri)
        timeout-minutes: 75
        working-directory: app
        run: bun run tauri build --bundles app

      - name: Sign DustMap.app
        timeout-minutes: 15
        shell: bash
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/DustMap.app"
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize and staple DustMap.app
        timeout-minutes: 40
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/DustMap.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/DustMap.zip"
          .github/scripts/notarize.sh "$RUNNER_TEMP/DustMap.zip"
          xcrun stapler staple "$APP"

      - name: Package, sign, and notarize DMG
        timeout-minutes: 40
        shell: bash
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/DustMap.app"
          VERSION="$(jq -r .version app/src-tauri/tauri.conf.json)"
          DMG="target/release/bundle/dmg/DustMap_${VERSION}_aarch64.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" "$(dirname "$DMG")"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DustMap" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" "$DMG"
          .github/scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      - name: Build and sign CLI binary
        timeout-minutes: 30
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p dustmap-cli
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" target/release/dustmap
          codesign --verify --strict --verbose=2 target/release/dustmap

      - name: Verify signatures and notarization
        shell: bash
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/DustMap.app"
          DMG="$(ls target/release/bundle/dmg/*.dmg | head -n 1)"
          codesign --verify --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl -a -t exec -vv "$APP"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/DustMap.zip"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp target/release/bundle/dmg/*.dmg release-assets/
          cp target/release/dustmap release-assets/dustmap-darwin-arm64
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          name: DustMap ${{ github.ref_name }}
