name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Full Verification Suite (.verify)
        run: .verify/run.sh

      - name: Install Frontend Dependencies
        working-directory: app
        run: bun install

      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "ERROR: APPLE_CERTIFICATE secret is required (release binaries must be Developer ID–signed at build)"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychain -d user | tr -d '"')

      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ]; then
            echo "NOTE: APPLE_API_KEY_P8 secret is not configured; notarization will be skipped."
            exit 0
          fi
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build Tauri Desktop Application
        working-directory: app
        run: bun run tauri build

      - name: Build Standalone CLI Binary
        run: cargo build --release -p dustmap-cli

      - name: Sign Binaries (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_IDENTITY:-}" ]; then
            echo "ERROR: APPLE_IDENTITY secret is required (Developer ID Application only; ad-hoc disabled)"
            exit 1
          fi

          # 1. Sign GUI application bundle
          APP="target/release/bundle/macos/DustMap.app"
          xattr -cr "$APP"
          echo "Signing GUI application with Developer ID: $APPLE_IDENTITY"
          codesign --force --options runtime --timestamp --deep --sign "$APPLE_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          CS_APP="$(codesign -dv --verbose=2 "$APP" 2>&1 || true)"
          if ! echo "$CS_APP" | grep -q 'Authority=Developer ID Application:'; then
            echo "ERROR: application bundle is not Developer ID–signed after codesign"
            echo "$CS_APP" | head -20
            exit 1
          fi

          # 2. Sign CLI standalone binary
          BIN="target/release/dustmap"
          xattr -cr "$BIN"
          echo "Signing CLI binary with Developer ID: $APPLE_IDENTITY"
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          CS_BIN="$(codesign -dv --verbose=2 "$BIN" 2>&1 || true)"
          if ! echo "$CS_BIN" | grep -q 'Authority=Developer ID Application:'; then
            echo "ERROR: CLI binary is not Developer ID–signed after codesign"
            echo "$CS_BIN" | head -20
            exit 1
          fi

      - name: Package, sign, notarize, and staple DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/DustMap.app"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p target/release/bundle/dmg
          DMG="target/release/bundle/dmg/DustMap_0.1.0_aarch64.dmg"
          API_KEY="$RUNNER_TEMP/AuthKey.p8"

          # 1. Package the signed application into DMG staging
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DustMap" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # 2. Sign the DMG
          echo "Signing DMG with Developer ID: $APPLE_IDENTITY"
          codesign --force --timestamp --sign "$APPLE_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"

          # 3. Notarize with the App Store Connect API key (if provided)
          if [ -f "$API_KEY" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER_ID:-}" ]; then
            echo "Submitting DMG for Apple notarization via notarytool..."
            if ! xcrun notarytool submit "$DMG" \
                --key "$API_KEY" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" \
                --wait; then
              echo "Notarization failed. Fetch the log with:"
              echo "  xcrun notarytool history --key ... (find the submission ID), then"
              echo "  xcrun notarytool log <submission-id> --key ... --key-id ... --issuer ..."
              exit 1
            fi

            # 4. Staple and verify ticket
            echo "Stapling notarization ticket to DMG..."
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl -a -t open --context context:primary-signature -v "$DMG"
          else
            echo "NOTE: Notarization skipped (AuthKey.p8 or API credentials not provided)."
          fi

      - name: Clean up signing material (macOS)
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
          rm -rf "$RUNNER_TEMP/dmg-stage"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp target/release/bundle/dmg/*.dmg release-assets/ 2>/dev/null || true
          cp target/release/dustmap release-assets/dustmap-darwin-arm64
          cd release-assets
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          body_path: CHANGELOG.md
          name: DustMap ${{ github.ref_name }}
