[workspace]
resolver = "2"
members = [
    "crates/dustmap-core",
    "crates/dustmap-cli",
    "crates/dustmap-rules",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = []
license = "Apache-2.0"
repository = "https://github.com/abhiudayg/dustmap"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
walkdir = "2"
rayon = "1"
sysinfo = "0.32"
trash = "5"
bytesize = "1"
blake3 = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
